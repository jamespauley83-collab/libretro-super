services:
  preview:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PYTHONUNBUFFERED=1
    command: ["python3", "preview/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: on-failure
